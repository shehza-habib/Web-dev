<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Registration Form</h1>
    <label for="name">Student name :</label>
    <input type="text" id="name" placeholder="First name">
    <!-- <label for="last">Last Name</label> -->
    <input type="text" id="last" placeholder="Last name">
    <br><br>
    <label for="NO">Roll Number : </label>
    <input type="NUMBER" id="NO">
    <br><br>
    <label for="pass">Password :</label>
    <input type="text" id="pass">
    <br><br>
    <label for="em">Email : </label>
    <input type="email" id="em">
    <br><br>
    <label for="date">Date of Birth :</label>
    <input type="text" id="date" placeholder="DATE, MONTH, YEAR">
    <br><br>
    <label for="gender"> Gender :</label>


    <input type="radio" name="gender" id="Male">
    <label for="Male">Male</label>


    <input type="radio" name="gender" id="female">
    <label for="female">Female</label>
    <br><br>
    <label for="de">Department :</label>
    <input type="radio" name="departmet" id="de">
    <label for="cES">CSE</label>
    <input type="radio" name="departmet" id="IT">
    <label for="IT">IT</label>
    <input type="radio" name="departmet" id="Civic">
    <label for="Civic">Civic</label>
    <br><br>
    <label for="Course">Course :</label>
    <select name="cor" id="Course">
        <option value="AI">Artificial Intelligence</option>
        <option value="cs">Cyber Security</option>
        <option value="gn">Generectic AI</option>
        <option value="Wd">web deveploment
        </option>
    </select>
    <br><br>
    <label for="SP">Student Photo :</label>
    <input type="file" id="SP" name="student-phto" accept="image/*">
    <br><br>

    <button type="submit">Submit</button>
    <br>
    <br>
    <a href="./shizukaresume.html">Resume</a>
</body>

</html>
