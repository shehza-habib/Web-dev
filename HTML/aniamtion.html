<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
.main{
    /* border: 1px solid black; */
    height: 130px;
    width: 120px;
    display: inline-block;
    margin-top:170px;
    margin-left:50px;
    text-align: center;
    font-size: 100px;
    border-radius: 40px;
    /* background:linear-gradient(to right, #FF6B6B, #FF8E53, #FFD200, #4E9F3D, #4D96FF, #6C5CE7, #FF8AAE); */


    box-sizing: border-box;
    animation-name: poping;
    animation-duration:2s;
    animation-iteration-count: infinite;
    transition: transform 0.5s;


}


.orange{
    color: #FF8E53;
}

.red{
    color: #FF6B6B;
}

.blue{
    color: #4D96FF;
}

.green{
    color: #4E9F3D;
}

.yellow{
    color: #FFD200;
}

.purple{
    color: #6C5CE7;
}


@keyframes poping{
    0%{ transform: scale(1.1);}
    10%{ transform: scale(1.2);}
    20%{ transform: scale(1.3);}
    30%{ transform: scale(1.4);}
    40%{ transform: scale(1.5);}
    50%{transform: scale(1.6);}
    60%{transform: scale(1.7);}


}    
</style>
</head>
<body>
    <div class="main"> <span class="red">W</span></div>
    <div class="main"> <span class="orange">E</span></div>
    <div class="main"> <span class="yellow">L</span></div>
    <div class="main"> <span class="green">C</span></div>
    <div class="main"> <span class="blue">O</span></div>
    <div class="main"> <span class="purple">M</span></div>
    <div class="main"> <span class="pink">E</span></div>
</body>
</html>
